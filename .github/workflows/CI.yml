name: CI
on:
  push:
    branches:
      - 'main'
      - 'dev'
    tags: '*'
  pull_request:
    branches:
      - 'main'
      - 'dev'
  release:
    types: [published]

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          # Forcing every test dependency to its latest individually can create
          # an unsatisfiable environment. In particular, registered BEAST 2.10
          # requires CompScienceMeshes <= 0.12, while this package also supports
          # CompScienceMeshes 0.13, and JET >= 0.12.2 requires Julia >= 1.11.
          force_latest_compatible_version: false
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
